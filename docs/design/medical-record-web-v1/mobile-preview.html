onst picker=document.getElementById('picker'),frame=document.getElementById('phone');const ids=[...picker.options].map(x=>x.value);const requested=new URLSearchParams(location.search).get('screen');picker.value=ids.includes(requested)?requested:ids[0];function show(){frame.src='index.html?screen='+picker.value+'&raw';history.replaceState(null,'','?screen='+picker.value)}picker.addEventListener('change',show);frame.addEventListener('load',()=>{try{const id=new URL(frame.contentWindow.location.href).searchParams.get('screen');if(ids.includes(id)){picker.value=id;history.replaceState(null,'','?screen='+id)}}catch{}});show();</script></html>
