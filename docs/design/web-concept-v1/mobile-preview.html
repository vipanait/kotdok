<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лапка · мобильное превью</title><style>@font-face{font-family:Nunito;src:url(../mobile-concept-v1/assets/Nunito.ttf)}@font-face{font-family:Manrope;src:url(../mobile-concept-v1/assets/Manrope.ttf)}*{box-sizing:border-box}body{margin:0;background:#eee7da;color:#1f1b15;font:14px/1.6 Manrope,sans-serif}header{max-width:1330px;margin:40px auto 28px;padding:0 24px}h1{font:800 38px/1.2 Nunito;margin:15px 0}p{color:#6e675b}a{color:#0b6b5e;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,390px));gap:32px 24px;justify-content:center;padding:0 24px 50px}figure{margin:0;min-width:0}figure img{width:100%;height:auto;display:block;border:1px solid #ded3c2;border-radius:22px;box-shadow:0 8px 24px #3027110c}figcaption{margin:0 0 12px;font-weight:700;font-size:15px}figcaption span{color:#0b6b5e;margin-right:9px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px;padding:18px}select{font:inherit;max-width:90vw;padding:10px;border:1px solid #d7cebe;background:white;border-radius:10px}.phone{width:390px;max-width:100%;height:844px;border:0;display:block;margin:0 auto 35px;box-shadow:0 12px 50px #30271122;border-radius:24px;background:#fbf6ee}.hint{text-align:center;margin:0 20px 18px;font-size:12px}@media(max-width:440px){.phone{width:100%;border-radius:0}.toolbar{gap:8px}h1{font-size:30px}}</style><div class="toolbar"><a href="mobile.html">← Все мобильные экраны</a><label>Экран <select id="picker"><option value="landing">01 · Главная</option><option value="login">02 · Вход</option><option value="register">03 · Регистрация</option><option value="forgot">04 · Восстановление пароля</option><option value="password">05 · Новый пароль</option><option value="sent">06 · Письмо отправлено</option><option value="auth-error">07 · Ошибка входа</option><option value="dashboard">08 · Кабинет</option><option value="dashboard-empty">09 · Первый вход</option><option value="pets">10 · Питомцы</option><option value="pet-new">11 · Добавление питомца</option><option value="pet-cat">12 · Карточка кошки</option><option value="pet-dog">13 · Карточка собаки</option><option value="check">14 · Проверка симптомов</option><option value="check-empty">15 · Проверка без питомцев</option><option value="loading">16 · Ожидание</option><option value="check-error">17 · Ошибка проверки</option><option value="result-emergency">18 · Результат · Экстренно</option><option value="result-urgent">19 · Результат · Срочно</option><option value="result-monitor">20 · Результат · Наблюдаем</option><option value="result-home_care">21 · Результат · Домашний уход</option><option value="result-healthy">22 · Результат · Всё в порядке</option><option value="history">23 · История</option><option value="history-empty">24 · Пустая история</option><option value="credits">25 · Нет проверок</option><option value="credits-pending">26 · Запрос на рассмотрении</option><option value="credits-rejected">27 · Запрос отклонён</option><option value="deletion">28 · Удаление аккаунта</option><option value="legal">29 · Условия сервиса</option><option value="admin">30 · Статистика администратора</option></select></label></div><p class="hint">390 × 844 px · Прокручивайте внутри телефона · Демонстрационный прототип</p><iframe class="phone" title="Мобильная версия сайта Лапка" id="phone"></iframe><script>const picker=document.getElementById('picker'),frame=document.getElementById('phone');const ids=[...picker.options].map(x=>x.value);const requested=new URLSearchParams(location.search).get('screen');picker.value=ids.includes(requested)?requested:ids[0];function show(){frame.src='index.html?screen='+picker.value+'&raw';history.replaceState(null,'','?screen='+picker.value)}picker.addEventListener('change',show);frame.addEventListener('load',()=>{try{const id=new URL(frame.contentWindow.location.href).searchParams.get('screen');if(ids.includes(id)){picker.value=id;history.replaceState(null,'','?screen='+id)}}catch{}});show();</script></html>
