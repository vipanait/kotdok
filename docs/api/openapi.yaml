      summary: Queue an analysis
      description: Returns a job, not a result. Repeating the request with the same idempotency key and
        the same data returns the original job; changing the data returns 409. `today`, the owner's
        calendar day, is what the pet's medical record is read on for the analysis (current courses,
        overdue dates) — a query parameter, since the body is strict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
        - name: today
          in: query
          required: false
          description: The owner's calendar day. Used only from the UTC day before the server's to the UTC day
            after; otherwise, or without it, the server's UTC day.
