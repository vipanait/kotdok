paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: dependency_unavailable
                  message: Service is not ready
                  request_id: 01J000000000000000000000
  /auth/reauth:
    post:
      summary: Prove a fresh authentication before a sensitive operation
      description: Freshness is read from the access token's `amr` claim, which records when the person
        actually authenticated and does not move when the token is refreshed. The proof it returns
        is bound to one user and one operation, expires, and is spent once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: A proof, good once and not for long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthProof"
        "400":
          description: Request body or query is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Request body or query is invalid
                  request_id: 01J000000000000000000000
        "401":
          description: "One of (error.code tells which): unauthorized — Missing, malformed, expired or foreign
            access token; reauth_required — Signed in, but the last authentication is too old for
            this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                unauthorized:
                  value:
                    error:
                      code: unauthorized
                      message: Missing, malformed, expired or foreign access token
                      request_id: 01J000000000000000000000
                reauth_required:
                  value:
                    error:
                      code: reauth_required
                      message: Signed in, but the last authentication is too old for this operation
                      request_id: 01J000000000000000000000
        "403":
          description: Account is being deleted, or consent to personal data processing is required
            (error.code tells which)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: account_deleting
                  message: Account is being deleted, or consent to personal data processing is required (error.code
                    tells which)
                  request_id: 01J000000000000000000000
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
