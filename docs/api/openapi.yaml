paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: dependency_unavailable
                  message: Service is not ready
                  request_id: 01J000000000000000000000
  /me:
    get:
      summary: Own profile, locale, balance and capabilities
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          description: Missing, malformed, expired or foreign access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: unauthorized
                  message: Missing, malformed, expired or foreign access token
                  request_id: 01J000000000000000000000
        "403":
          description: Account is being deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: account_deleting
                  message: Account is being deleted
                  request_id: 01J000000000000000000000
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: rate_limited
                  message: Too many requests
                  request_id: 01J000000000000000000000
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: internal_error
                  message: Unexpected server error
                  request_id: 01J000000000000000000000
    patch:
      summary: Change the allowed profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          description: Request body or query is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Request body or query is invalid
                  request_id: 01J000000000000000000000
        "401":
          description: Missing, malformed, expired or foreign access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: unauthorized
                  message: Missing, malformed, expired or foreign access token
                  request_id: 01J000000000000000000000
