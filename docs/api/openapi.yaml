  /account-deletion:
    post:
      summary: Request account deletion after a fresh identity check
      description: Accepting the request is not the same as finishing it. The client keeps the receipt
        secret so it can poll status after its session is gone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionAccepted"
        "400":
          description: Request body or query is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: bad_request
                  message: Request body or query is invalid
                  request_id: 01J000000000000000000000
        "401":
          description: "One of (error.code tells which): unauthorized — Missing, malformed, expired or foreign
            access token; reauth_required — Signed in, but the last authentication is too old for
            this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                unauthorized:
                  value:
                    error:
                      code: unauthorized
                      message: Missing, malformed, expired or foreign access token
                      request_id: 01J000000000000000000000
                reauth_required:
                  value:
                    error:
                      code: reauth_required
                      message: Signed in, but the last authentication is too old for this operation
                      request_id: 01J000000000000000000000
        "403":
          description: "One of (error.code tells which): account_deleting — Account is being deleted, or
            consent to personal data processing is required (error.code tells which); forbidden —
            Authenticated but not allowed to perform this operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                account_deleting:
                  value:
                    error:
                      code: account_deleting
                      message: Account is being deleted, or consent to personal data processing is required (error.code
                        tells which)
                      request_id: 01J000000000000000000000
                forbidden:
                  value:
                    error:
                      code: forbidden
                      message: Authenticated but not allowed to perform this operation
                      request_id: 01J000000000000000000000
        "404":
          description: No such resource for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: not_found
                  message: No such resource for this user
                  request_id: 01J000000000000000000000
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: rate_limited
                  message: Too many requests
                  request_id: 01J000000000000000000000
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: internal_error
                  message: Unexpected server error
                  request_id: 01J000000000000000000000
  /account-deletion/status:
    get:
      summary: Deletion status by receipt, without access to the profile
      description: "Authenticated by the receipt secret alone; the response carries no email, user id or
        data, and is served with Cache-Control: no-store."
      security: []
      parameters:
        - name: X-Deletion-Receipt
          in: header
          required: true
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
      responses:
        "200":
