# Reverse proxy in front of Vercel for users whose networks cannot reach
# Vercel's addresses directly. The domain resolves here; every request is
# passed to Vercel with its original Host, so the app sees lapka.my as usual.
#
# Upstreams are Vercel's addresses for custom domains, not *.vercel.app:
# from Yandex Cloud the *.vercel.app addresses (…131) do not accept
# connections at all, while these do.
#
# /etc/nginx/ssl/lapka.{crt,key} start as a self-signed pair (install.sh)
# and become links to the Let's Encrypt certificate (issue-cert.sh), so this
# file never changes between the two. See docs/architecture/ru-proxy.md.

upstream vercel_https {
    server 216.198.79.1:443 max_fails=2 fail_timeout=30s;
    server 64.29.17.1:443   max_fails=2 fail_timeout=30s;
    server 76.76.21.21:443  backup;
    keepalive 32;
}

upstream vercel_http {
    server 216.198.79.1:80 max_fails=2 fail_timeout=30s;
    server 64.29.17.1:80   max_fails=2 fail_timeout=30s;
    server 76.76.21.21:80  backup;
}

# Anything not addressed to lapka.my is dropped, so the box cannot be used
# to reach other sites hosted on Vercel.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name lapka.my www.lapka.my;

    # Both this box and Vercel renew certificates for lapka.my over HTTP-01.
    # A challenge file certbot left here is ours; any other one is Vercel's.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri @vercel_acme;
    }

    location @vercel_acme {
        proxy_pass http://vercel_http;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lapka.my www.lapka.my;

    ssl_certificate     /etc/nginx/ssl/lapka.crt;
    ssl_certificate_key /etc/nginx/ssl/lapka.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass https://vercel_https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;

        # Pages stream (React Server Components); pass bytes through as they come.
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}
